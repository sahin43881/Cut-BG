name = "cutbg-api"
main = "worker/index.ts"
compatibility_date = "2025-01-15"
workers_dev = true

# Public, non-secret config. Override per environment as needed.
# ALLOWED_ORIGIN is a comma-separated list — first match wins, others
# are echoed back when the request's Origin matches.
[vars]
ALLOWED_ORIGIN = "https://cut-bg.vercel.app"
RATE_LIMIT_PER_HOUR = "20"

# KV namespace for per-IP rate limiting.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "ed641a28d2ef46e7b8fd86877e9928ae"

# KV namespace for coarse usage stats (one entry per UTC day).
[[kv_namespaces]]
binding = "STATS"
id = "8c915f367a3441a4b4aff7a52c346e3b"

# To add a custom domain later: uncomment, set zone_name to your domain,
# and deploy with `wrangler deploy --env production`. Create matching prod
# KV namespaces first via `wrangler kv:namespace create rate_limits --env production`.
# [env.production]
# name = "cutbg-api"
# workers_dev = false
# [[env.production.routes]]
# pattern = "api.your-domain.com/*"
# zone_name = "your-domain.com"
